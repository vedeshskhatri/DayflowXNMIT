<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dfFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3E4E" />
      <stop offset="50%" stop-color="#3F556B" />
      <stop offset="100%" stop-color="#5E7892" />
    </linearGradient>

    <linearGradient id="dfFavSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8E9E83" />
      <stop offset="100%" stop-color="#BDCFAA" />
    </linearGradient>

    <linearGradient id="dfFavInfinity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDCFAA" />
      <stop offset="35%" stop-color="#F3EFDF" />
      <stop offset="70%" stop-color="#A7B7C6" />
      <stop offset="100%" stop-color="#BDCFAA" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dfFavBg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#BDCFAA" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Rising Sun Behind Infinity Loop -->
  <path d="M 23 34 A 9 9 0 0 1 41 34 Z" fill="url(#dfFavSun)" opacity="0.95" />

  <!-- Sun Rays -->
  <line x1="32" y1="16" x2="32" y2="21" stroke="#BDCFAA" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="20" x2="25" y2="24" stroke="#BDCFAA" stroke-width="2.5" stroke-linecap="round" />
  <line x1="42" y1="20" x2="39" y2="24" stroke="#BDCFAA" stroke-width="2.5" stroke-linecap="round" />
  <line x1="15" y1="28" x2="19" y2="30.5" stroke="#BDCFAA" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="49" y1="28" x2="45" y2="30.5" stroke="#BDCFAA" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Infinity Flow Ribbon -->
  <path
    d="M 32 39 C 24 28 11 28 11 39 C 11 50 24 50 32 39 C 40 28 53 28 53 39 C 53 50 40 50 32 39 Z"
    stroke="url(#dfFavInfinity)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Center Core Accent Glow -->
  <circle cx="32" cy="39" r="1.5" fill="#FFFFFF" />
</svg>
